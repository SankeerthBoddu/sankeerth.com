# About Section
about_title: About
about_profile_image: images/profile1.jpg
about_content: |
  I am a senior cloud, AI, and data platform engineer with 19+ years of experience building systems that have to be reliable, auditable, and useful.

  My professional work sits where platform engineering meets data. I work on cloud infrastructure, AI-enabled automation, secure delivery pipelines, and the data systems around them: ETL, streaming, warehouse analytics, and reporting. I have worked across Azure, AWS, and GCP, with hands-on delivery using Terraform, Kubernetes, CI/CD, security scanning, and observability.

  Outside work, I build personal software products and labs to stay close to product thinking and hands-on engineering. That includes **[ApplyBench.com](https://applybench.com)**, **[MayaGuru.com](https://mayaguru.com)**, Home Assistant add-ons, n8n automation, and Web3 experiments.

  **M.S. Computer Science** | **7 cloud and platform certifications** across Azure, AWS, GCP, Kubernetes, Terraform, and cloud security.

