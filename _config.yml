# About Section
about_title: About
about_profile_image: images/profile1.jpg
about_content: |
  I design and deliver cloud, AI, and data platforms that need to be secure, observable, reliable, and maintainable. My work spans architecture and hands-on engineering across Azure, AWS, and GCP.

  Professionally, I work across cloud infrastructure, AI-enabled automation, secure delivery pipelines, ETL and streaming systems, warehouse analytics, identity, observability, and production governance. Terraform, Kubernetes, CI/CD, security controls, and operational readiness are recurring parts of that work.

  Outside work, I build **RAGAssure**, the **Secure Enterprise AI Assistant**, **[ApplyBench.com](https://applybench.com)**, **[MayaGuru.com](https://mayaguru.com)**, Home Assistant Apps, and other labs as hands-on proof-of-work around complete systems rather than startup-traction claims.

  **M.S. Computer Science** | **7 cloud and platform certifications** across Azure, AWS, GCP, Kubernetes, Terraform, and cloud security.

content:
  - title: Personal Projects
    layout: list
    content:
      - layout: left
        border: weak
        title: ApplyBench.com
        link: https://applybench.com
        link_text: Visit ApplyBench
        quote: >
          Personal AI product for job search workflows
        description: |
          Personal product for pay-per-use career tools: CV analysis, ATS scoring, cover letters, interview preparation, LinkedIn optimization, job comparison, and salary insights.

          **Engineering focus:** grounded job intake and source trust, authentication, credit and AI-budget controls, rate limiting, durable AI workflows, persisted results, recovery/refunds, retention/redaction, and turning model output into actionable job decisions.

      - layout: left
        border: weak
        title: MayaGuru.com
        link: https://mayaguru.com
        link_text: Visit MayaGuru
        quote: >
          Personal AI product for image workflows and conversational assistance
        description: |
          Personal product built around practical image workflows for real estate agents and e-commerce sellers, plus the Maya conversational assistant.

          **What it includes:** virtual staging, day-to-dusk conversion, background removal, AI headshots, product photography, photo restoration, HD upscaling, and a streaming AI assistant.

          **Engineering focus:** monorepo and multi-app architecture, shared cross-subdomain identity, credit and usage controls, AI image pipelines, streaming conversational AI, rate limiting, conversation persistence, and model/GPU cost controls.

      - layout: left
        border: weak
        title: RAGAssure
        link: https://github.com/SankeerthBoddu/ragassure
        link_text: View on GitHub
        additional_links:
          - title: Code
            icon: fab fa-github
            url: https://github.com/SankeerthBoddu/ragassure
          - title: PyPI
            icon: fab fa-python
            url: https://pypi.org/project/ragassure/
        quote: >
          Identity-aware contract testing and release assurance for enterprise RAG
        description: |
          Provider-neutral evaluation framework that combines standard RAG quality checks with principal-aware required/forbidden evidence and deterministic CI release gates. **RAGAssure 0.1.0 alpha is released on PyPI.**

          **Engineering focus:** executable golden datasets, identity-aware evidence contracts, retrieval precision/recall, latency and cost thresholds, reports, adapters, Docker, PyPI packaging, and release automation.

      - layout: left
        border: weak
        title: Secure Enterprise AI Assistant
        link: https://github.com/SankeerthBoddu/secure-enterprise-ai-assistant
        link_text: View on GitHub
        additional_links:
          - title: Code
            icon: fab fa-github
            url: https://github.com/SankeerthBoddu/secure-enterprise-ai-assistant
        quote: >
          Secure enterprise RAG application with authorization before generation
        description: |
          Public reference application that makes the evidence authorization boundary explicit before generation and uses RAGAssure to catch principal-specific retrieval regressions before release.

          **Current milestone:** FastAPI + Next.js, synthetic employee/manager principals, deterministic candidate retrieval, authorization before generation, allowed-only citations, Docker, and a live RAGAssure CI gate. **Next:** pgvector semantic/hybrid retrieval, grounded model generation, telemetry, real identity, and stronger policy/data enforcement.

      - layout: left
        border: weak
        title: ha-rustdesk-server
        link: https://github.com/SankeerthBoddu/ha-rustdesk-server
        link_text: View on GitHub
        additional_links:
          - title: Code
            icon: fab fa-github
            url: https://github.com/SankeerthBoddu/ha-rustdesk-server
        quote: >
          Open-source Home Assistant App for self-hosted RustDesk infrastructure
        description: |
          Public Home Assistant App that packages the RustDesk ID/rendezvous and relay services so users can run remote-desktop infrastructure they control.

          **Engineering focus:** Home Assistant App packaging, native `amd64`/`aarch64` container builds, upstream checksum verification, security scanning, GHCR multi-architecture publishing, release automation, and practical self-hosting ergonomics.

      - layout: left
        border: weak
        title: n8n Marketing Workflows
        link: https://github.com/SankeerthBoddu/n8n-marketing-workflows
        link_text: View on GitHub
        additional_links:
          - title: Code
            icon: fab fa-github
            url: https://github.com/SankeerthBoddu/n8n-marketing-workflows
        quote: >
          Public automation reference for AI-assisted marketing workflows
        description: |
          Reference n8n workflows for AI content drafting, approval buffers, social posting, before/after showcases, and portfolio-style promotion.

          **Engineering focus:** n8n workflow design, Gemini prompting, webhook patterns, social API glue, Google Sheets review queues, and safe credential templating.

      - layout: left
        border: weak
        title: Power Platform AI Portal
        link: https://github.com/SankeerthBoddu/power-platform-ai-portal
        link_text: View on GitHub
        additional_links:
          - title: Code
            icon: fab fa-github
            url: https://github.com/SankeerthBoddu/power-platform-ai-portal
        quote: >
          Azure AI and Power Platform integration proof of concept
        description: |
          Public proof of concept integrating Azure AI Foundry with Microsoft Power Platform to categorize and prioritize IT asset requests.

          **Tech:** Azure Functions, Azure AI Foundry, Power Automate, Dataverse, Power Pages, Power Apps, and OpenAPI.

  - title: Experience
    layout: list
    content:
      - layout: left
        title: Senior Cloud & DevOps Engineer
        sub_title: Publicis Sapient (Financial & Public Sector)
        caption: Sep 2021 - Present
        description: |
          - Built an internal Azure AI Foundry application that generated Terraform code with retrieval-based grounding and GitOps automation.
          - Designed platform automation and DevSecOps pipelines in Azure DevOps with Terraform, Kubernetes, Veracode, Snyk, SonarQube, and SBOM generation.
          - Worked on warehouse-centered data pipelines and operational analytics, including Snowflake Cortex for AI-assisted enrichment and summarization.
          - Supported Kubernetes delivery and OpenTelemetry instrumentation patterns for service health, traces, metrics, and logs.
          - Prototyped agent workflows with Google ADK and Gemini for practical internal automation use cases.
          - Delivered self-service portals using Power Pages, Power Automate, Dynamics 365, and Dataverse with role-based access patterns.

      - layout: left
        title: Senior DevOps Engineer
        sub_title: Northrop Grumman (Public Sector)
        caption: Mar 2018 - Sep 2021
        description: |
          - Architected Lambda architecture processing petabytes of streaming data with Kafka, Spark, HBase, and Cassandra for real-time analytics.
          - Automated platform lifecycle with Terraform, Ansible, Kubernetes, and Jenkins CI/CD pipelines.
          - Implemented monitoring and alerting for Kafka and Hadoop ecosystem components in a compliance-focused environment.

      - layout: left
        title: ETL Architect
        sub_title: Polaris Consulting (Financial Sector)
        caption: Jun 2006 - Apr 2018
        description: |
          - Architected expense analytics data warehouse integrating Oracle AP, P2P systems, invoices, and external feeds into a centralized repository.
          - Built scalable ETL pipelines with Ab Initio, designed star-schema models, and managed nightly batch loads.
          - Delivered BI solutions using MicroStrategy and Business Objects with row-level security controls.

