# About Section
about_title: About
about_profile_image: images/profile1.jpg
about_content: |
  I am a senior cloud, AI, DevOps, security, and data platform engineer with 19+ years of experience building systems that have to be reliable, auditable, and useful.

  My professional work centers on cloud platforms, AI-enabled automation, infrastructure automation, DevSecOps pipelines, data ingestion, analytics platforms, and enterprise workflow systems. I have worked across Azure, AWS, and GCP, with hands-on delivery using Terraform, Kubernetes, CI/CD, security scanning, ETL pipelines, streaming systems, and reporting platforms.

  Outside work, I build personal software projects to stay close to the product side of engineering. That includes **[MayaGuru.com](https://mayaguru.com)**, **[ApplyBench.com](https://applybench.com)**, Home Assistant add-ons, n8n automation, and Web3 experiments.

  **M.S. Computer Science** | **7 cloud and platform certifications** across Azure, AWS, GCP, Kubernetes, Terraform, and cloud security.

