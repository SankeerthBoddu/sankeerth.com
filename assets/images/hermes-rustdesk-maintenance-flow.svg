<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Renovate, Hermes, CI and governed release flow</title>
  <desc id="desc">Architecture showing upstream dependencies feeding Renovate, Hermes with a repository skill and Mnemosyne memory, GitHub CI, human approval, Release Drafter, Deploy, GHCR, and Home Assistant users.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#09152f"/><stop offset="55%" stop-color="#12275b"/><stop offset="100%" stop-color="#0b5c66"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2e6af3"/><stop offset="1" stop-color="#5b8dff"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6d4aff"/><stop offset="1" stop-color="#aa63ff"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14a36f"/><stop offset="1" stop-color="#35d49a"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ed8b2c"/><stop offset="1" stop-color="#ffbc5e"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.30"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#a9c8ff"/></marker>
    <style>.title{font:700 42px Inter,Segoe UI,Arial,sans-serif;fill:#fff}.sub{font:400 20px Inter,Segoe UI,Arial,sans-serif;fill:#c8d8ff}.boxTitle{font:700 24px Inter,Segoe UI,Arial,sans-serif;fill:#fff}.boxSub{font:400 16px Inter,Segoe UI,Arial,sans-serif;fill:#eaf0ff}.tiny{font:600 13px Inter,Segoe UI,Arial,sans-serif;fill:#d6e3ff;letter-spacing:.6px}.label{font:700 14px Inter,Segoe UI,Arial,sans-serif;fill:#a9c8ff;letter-spacing:.5px}.flow{stroke:#a9c8ff;stroke-width:4;fill:none;marker-end:url(#arrow)}.soft{fill:#ffffff0d;stroke:#ffffff24;stroke-width:1.5}</style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/><circle cx="1420" cy="100" r="250" fill="#4d8dff" opacity="0.08"/><circle cx="150" cy="830" r="280" fill="#39d3a2" opacity="0.06"/>
  <text x="80" y="80" class="title">From Dependency Signal to Governed Release</text><text x="80" y="116" class="sub">Renovate detects. Hermes operates. CI verifies. Humans authorize shipping.</text>
  <rect x="70" y="190" width="300" height="185" rx="24" class="soft" filter="url(#shadow)"/><text x="100" y="230" class="label">CHANGE SOURCES</text><text x="100" y="270" class="boxTitle">Upstream</text><text x="100" y="304" class="boxSub">RustDesk Server releases</text><text x="100" y="332" class="boxSub">Home Assistant base images</text><text x="100" y="360" class="boxSub">GitHub Actions + packages</text>
  <rect x="455" y="200" width="270" height="165" rx="24" fill="url(#green)" filter="url(#shadow)"/><text x="485" y="242" class="label">DEPENDENCY SENSOR</text><text x="485" y="286" class="boxTitle">Renovate</text><text x="485" y="320" class="boxSub">Detects + proposes PRs</text><text x="485" y="346" class="boxSub">Maintains dependency dashboard</text>
  <rect x="790" y="155" width="430" height="255" rx="28" fill="url(#purple)" filter="url(#shadow)"/><text x="825" y="200" class="label">AGENT OPERATOR</text><text x="825" y="246" class="boxTitle">Hermes on Azure</text><text x="825" y="282" class="boxSub">Classifies update type + risk</text><text x="825" y="312" class="boxSub">Researches upstream release notes</text>
  <rect x="825" y="335" width="175" height="55" rx="16" fill="#30255f" stroke="#8f7bda"/><text x="912" y="358" text-anchor="middle" class="tiny">REPO SKILL</text><text x="912" y="379" text-anchor="middle" class="boxSub">procedure + guardrails</text><rect x="1015" y="335" width="175" height="55" rx="16" fill="#30255f" stroke="#8f7bda"/><text x="1102" y="358" text-anchor="middle" class="tiny">MNEMOSYNE</text><text x="1102" y="379" text-anchor="middle" class="boxSub">durable context only</text>
  <rect x="1275" y="195" width="255" height="175" rx="24" fill="url(#blue)" filter="url(#shadow)"/><text x="1305" y="237" class="label">POLICY ENGINE</text><text x="1305" y="281" class="boxTitle">GitHub CI</text><text x="1305" y="315" class="boxSub">Lint + version invariants</text><text x="1305" y="343" class="boxSub">Native amd64 / arm64 builds</text><text x="1305" y="371" class="boxSub">SHA-256 + Trivy scans</text>
  <path d="M370 282 H440" class="flow"/><path d="M725 282 H775" class="flow"/><path d="M1220 282 H1260" class="flow"/>
  <rect x="585" y="505" width="430" height="145" rx="28" fill="url(#orange)" filter="url(#shadow)"/><text x="620" y="550" class="label">ACCOUNTABILITY BOUNDARY</text><text x="620" y="596" class="boxTitle">Human approval gate</text><text x="620" y="629" class="boxSub">Merge normal PR • approve release • public maintainer actions</text><path d="M1400 370 C1400 450 1150 470 1015 565" class="flow"/>
  <rect x="70" y="505" width="420" height="215" rx="24" class="soft" filter="url(#shadow)"/><text x="100" y="548" class="label">HERMES CLASSIFICATION</text><text x="100" y="590" class="boxTitle">Not every PR is a release</text><text x="100" y="630" class="boxSub">A • CI/tooling → merge when green, no App release</text><text x="100" y="662" class="boxSub">B • runtime/base → packaging revision + release</text><text x="100" y="694" class="boxSub">C • RustDesk → full upstream review + release</text>
  <rect x="1100" y="500" width="430" height="220" rx="24" class="soft" filter="url(#shadow)"/><text x="1135" y="543" class="label">ONLY WHEN SHIPPING</text><text x="1135" y="585" class="boxTitle">Deterministic release path</text><text x="1135" y="622" class="boxSub">Release Drafter → exact v&lt;config version&gt;</text><text x="1135" y="652" class="boxSub">Explicit Deploy dispatch + strict tag guard</text><text x="1135" y="682" class="boxSub">Signed amd64 + arm64 → multi-arch GHCR</text><path d="M1015 577 H1085" class="flow"/>
  <rect x="500" y="760" width="600" height="82" rx="22" fill="#173557" stroke="#65dfb4" stroke-width="2" filter="url(#shadow)"/><text x="800" y="795" text-anchor="middle" class="boxTitle">Home Assistant users get a verified update</text><text x="800" y="824" text-anchor="middle" class="boxSub">Live state from GitHub • procedure in skill • durable context in memory</text><path d="M1315 720 C1315 790 1160 800 1115 800" class="flow"/>
  <text x="80" y="865" class="tiny">SankeerthBoddu / ha-rustdesk-server • agentic platform engineering with human release accountability</text>
</svg>
