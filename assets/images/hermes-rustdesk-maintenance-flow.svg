<rect width="1600" height="900" fill="#fbfcfe"/>
<text x="70" y="66" class="title">Repository maintenance as an operating system</text>
<text x="70" y="101" class="sub">Renovate finds change. Hermes applies procedure. CI proves the build. A human still owns shipping.</text>
<rect x="55" y="175" width="280" height="280" rx="20" fill="#fff" stroke="#ccd8e7" stroke-width="2"/>
<rect x="55" y="175" width="280" height="48" rx="20" fill="#fff" stroke="#159447" stroke-width="2"/>
<text x="195" y="206" text-anchor="middle" font-family="DejaVu Sans,Arial" font-size="19" font-weight="700" fill="#159447">Renovate</text>
<circle cx="81" cy="265" r="4" fill="#159447"/><text x="95" y="270" class="b">detect updates</text>
<circle cx="81" cy="312" r="4" fill="#159447"/><text x="95" y="317" class="b">open PRs</text>
<circle cx="81" cy="359" r="4" fill="#159447"/><text x="95" y="364" class="b">dependency dashboard</text>
<line x1="339" y1="315" x2="356" y2="315" stroke="#2f4968" stroke-width="3" marker-end="url(#a)"/>
