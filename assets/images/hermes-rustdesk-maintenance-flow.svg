<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#10233e"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.24"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#8cc8ff"/></marker>
  <style>
  .title{font:700 44px Inter,Segoe UI,Arial,sans-serif;fill:#fff}.sub{font:400 22px Inter,Segoe UI,Arial,sans-serif;fill:#b8c7da}
  .h{font:700 22px Inter,Segoe UI,Arial,sans-serif;fill:#fff}.b{font:400 17px Inter,Segoe UI,Arial,sans-serif;fill:#d4deea}
  .small{font:600 15px Inter,Segoe UI,Arial,sans-serif;fill:#c6d4e5}.pill{font:700 15px Inter,Segoe UI,Arial,sans-serif;fill:#07111f}
  .arrow{stroke:#8cc8ff;stroke-width:4;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect width="1600" height="900" rx="28" fill="url(#bg)"/>
<text x="70" y="78" class="title">Operating ha-rustdesk-server with Renovate + Hermes</text>
<text x="70" y="118" class="sub">Automate the work. Verify the release. Keep the human accountable for shipping.</text>
<g filter="url(#shadow)">
<rect x="65" y="190" width="205" height="225" rx="22" fill="#102d3c" stroke="#3db6d8" stroke-width="2"/>
<rect x="305" y="190" width="235" height="225" rx="22" fill="#251e49" stroke="#9b8cff" stroke-width="2"/>
<rect x="575" y="190" width="210" height="225" rx="22" fill="#153728" stroke="#63d09a" stroke-width="2"/>
<rect x="820" y="190" width="205" height="225" rx="22" fill="#3b2a13" stroke="#f0ba61" stroke-width="2"/>
<rect x="1060" y="190" width="215" height="225" rx="22" fill="#173259" stroke="#6ea9ff" stroke-width="2"/>
<rect x="1310" y="190" width="220" height="225" rx="22" fill="#2c1d43" stroke="#bc8cff" stroke-width="2"/>
</g>
<text x="167" y="232" text-anchor="middle" class="h">1. Renovate</text><text x="90" y="274" class="b">Detects updates</text><text x="90" y="306" class="b">Opens PRs</text><text x="90" y="338" class="b">Maintains dashboard</text><text x="90" y="370" class="b">Does not decide release</text>
<text x="422" y="232" text-anchor="middle" class="h">2. Hermes on Azure</text><text x="330" y="274" class="b">Loads repo skill</text><text x="330" y="306" class="b">Classifies risk</text><text x="330" y="338" class="b">Verifies checksums</text><text x="330" y="370" class="b">Prepares draft PR</text>
<text x="680" y="232" text-anchor="middle" class="h">3. GitHub CI</text><text x="600" y="274" class="b">Lint + metadata</text><text x="600" y="306" class="b">amd64 + aarch64</text><text x="600" y="338" class="b">SHA-256 verify</text><text x="600" y="370" class="b">Trivy security gates</text>
<text x="922" y="232" text-anchor="middle" class="h">4. Human Gate</text><text x="846" y="274" class="b">Review intent</text><text x="846" y="306" class="b">Approve merge</text><text x="846" y="338" class="b">Approve shipping</text><text x="846" y="370" class="b">Own accountability</text>
<text x="1167" y="232" text-anchor="middle" class="h">5. Release</text><text x="1085" y="274" class="b">config.yaml = truth</text><text x="1085" y="306" class="b">Exact v&lt;version&gt; tag</text><text x="1085" y="338" class="b">Explicit Deploy dispatch</text><text x="1085" y="370" class="b">Strict tag guard</text>
<text x="1420" y="232" text-anchor="middle" class="h">6. Deploy</text><text x="1335" y="274" class="b">Sign both images</text><text x="1335" y="306" class="b">Multi-arch manifest</text><text x="1335" y="338" class="b">Publish to GHCR</text><text x="1335" y="370" class="b">HA users can upgrade</text>
<path d="M270 305 H298" class="arrow"/><path d="M540 305 H568" class="arrow"/><path d="M785 305 H813" class="arrow"/><path d="M1025 305 H1053" class="arrow"/><path d="M1275 305 H1303" class="arrow"/>
<rect x="65" y="475" width="700" height="180" rx="22" fill="#0d1c30" stroke="#64748b" stroke-width="2"/>
<text x="95" y="515" class="h">Hermes context model</text>
<text x="95" y="555" class="b">Skill = procedure, release playbook, and guardrails</text>
<text x="95" y="590" class="b">Mnemosyne = durable context and maintainer preferences</text>
<text x="95" y="625" class="small">Versions, PRs, releases, CI state and main SHA are refreshed live from GitHub.</text>
<path d="M425 475 V430" class="arrow"/>
<rect x="800" y="475" width="730" height="180" rx="22" fill="#0d1c30" stroke="#64748b" stroke-width="2"/>
<text x="830" y="515" class="h">Renovate classification determines release behavior</text>
<rect x="830" y="545" width="205" height="44" rx="18" fill="#72d0ff"/><text x="932" y="573" text-anchor="middle" class="pill">A · CI / tooling</text>
<rect x="1060" y="545" width="210" height="44" rx="18" fill="#72e1ad"/><text x="1165" y="573" text-anchor="middle" class="pill">B · runtime / base</text>
<rect x="1295" y="545" width="205" height="44" rx="18" fill="#f5c36b"/><text x="1397" y="573" text-anchor="middle" class="pill">C · RustDesk</text>
<text x="1165" y="625" text-anchor="middle" class="small">A: merge when green / no App release  ·  B: packaging revision when shipping  ·  C: full version + checksum release path</text>
<rect x="65" y="710" width="1465" height="125" rx="22" fill="#0b1728" stroke="#2b527a" stroke-width="2"/>
<text x="95" y="750" class="h">Guardrail</text>
<text x="225" y="750" class="b">Hermes may inspect, research, branch, edit, verify, and open/update draft PRs.</text>
<text x="225" y="788" class="b">Merge, release, security-policy changes, and sensitive public maintainer actions require explicit human approval.</text>
<circle cx="105" cy="802" r="10" fill="#ff7d7d"/><text x="128" y="808" class="small">Never direct-push main or bypass CI/checksums.</text>
</svg>